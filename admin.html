<!doctype html>
<html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CUFA Admin</title><style>
:root{--r:#e50914;--b:#080b0e;--p:#11161b}*{box-sizing:border-box}body{margin:0;background:#070a0d;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.brand{font-weight:900;letter-spacing:2px}.brand b{color:var(--r);font-size:30px}.box{background:#11161b;border:1px solid #283038;border-radius:14px;padding:20px;margin-top:18px}input,select,textarea,button{width:100%;padding:13px;border-radius:8px;border:1px solid #343d45;background:#0b0f13;color:#fff;font:inherit;margin:6px 0}button{background:var(--r);border:0;font-weight:900;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.hide{display:none}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{width:auto}.item{background:#0b0f13;border:1px solid #283038;padding:14px;border-radius:10px;margin:9px 0}.muted{color:#aab2ba;font-size:13px}.aiout{white-space:pre-wrap;line-height:1.55}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top button{width:auto}.err{color:#ff6970}.ok{color:#6ee7a0}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}
</style></head><body><div class="wrap"><div class="brand">AUTO SERVIS <b>CUFA</b><div class="muted">ADMIN • vetëm për Fidanin</div></div>
<section id="login" class="box"><h2>Hyrja Admin</h2><input id="user" value="Fidan" autocomplete="username"><input id="pass" type="password" placeholder="Password" autocomplete="current-password"><button onclick="login()">HYR</button><div id="loginMsg"></div></section>
<main id="panel" class="hide"><div class="top"><h2>Paneli Admin</h2><button onclick="logout()">Dil</button></div><div class="tabs"><button onclick="showTab('bookings')">Terminet</button><button onclick="showTab('ai')">AI Diagnostika</button></div>
<section id="bookings" class="box"><div class="top"><h3>Terminet</h3><button onclick="loadBookings()">Rifresko</button></div><div id="list">Duke ngarkuar…</div></section>
<section id="ai" class="box hide"><h3>AI Diagnostika</h3><div class="grid"><input id="make" placeholder="Marka / modeli"><input id="year" placeholder="Viti"><input id="engine" placeholder="Motori"><input id="dtc" placeholder="Kodi DTC, p.sh. P0300"></div><textarea id="symptoms" rows="5" placeholder="Simptomat / çfarë po ndodh me automjetin"></textarea><label class="muted">Foto opsionale: scanner, drita në tabelë, pjesë e dëmtuar ose raport</label><input id="photo" type="file" accept="image/*" capture="environment"><button onclick="diagnose()">ANALIZO ME AI</button><div id="aiMsg"></div><div id="aiOut" class="box aiout hide"></div></section></main></div>
<script>
const API='https://script.google.com/macros/s/AKfycbz_3hT7W7MU28A1rAX3Usm54xUaLbZ4UoVbtsXL61M5x-39HLAhhGVmEukHKvg4mhMR/exec';let token=sessionStorage.getItem('cufa_admin')||'';
async function post(data){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});return r.json()}
async function login(){const m=document.getElementById('loginMsg');m.textContent='Duke hyrë…';try{const r=await post({action:'admin.login',username:user.value,password:pass.value});if(!r.ok)throw Error(r.error||'Hyrja dështoi');token=r.token;sessionStorage.setItem('cufa_admin',token);openPanel()}catch(e){m.className='err';m.textContent=e.message}}
function openPanel(){login.classList.add('hide');panel.classList.remove('hide');loadBookings()}
function logout(){post({action:'admin.logout',token}).catch(()=>{});sessionStorage.removeItem('cufa_admin');token='';location.reload()}
function showTab(id){bookings.classList.toggle('hide',id!=='bookings');ai.classList.toggle('hide',id!=='ai')}
async function loadBookings(){list.textContent='Duke ngarkuar…';try{const r=await post({action:'admin.bookings',token});if(!r.ok)throw Error(r.error||'Gabim');const rows=r.bookings||r.data||[];list.innerHTML=rows.length?rows.map(x=>'<div class="item"><b>'+(x.name||x.Emri||'')+'</b> • '+(x.phone||x.Telefoni||'')+'<div class="muted">'+(x.car||x.Automjeti||'')+' • '+(x.service||x['Shërbimi']||'')+' • '+(x.date||x['Data e terminit']||'')+'</div><div>'+(x.message||x.Mesazhi||'')+'</div><select onchange="setStatus(\''+(x.id||x.ID||'')+'\',this.value)"><option>'+(x.status||x.Statusi||'I RI')+'</option><option>I RI</option><option>KONFIRMUAR</option><option>PËRFUNDUAR</option><option>ANULUAR</option></select></div>').join(''):'Nuk ka termine.'}catch(e){list.innerHTML='<span class="err">'+e.message+'</span>'}}
async function setStatus(id,status){try{const r=await post({action:'admin.bookingStatus',token,id,status});if(!r.ok)throw Error(r.error||'Gabim')}catch(e){alert(e.message)}}
function fileData(file){return new Promise((res,rej)=>{if(!file)return res('');const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(file)})}
async function diagnose(){const m=document.getElementById('aiMsg'),out=document.getElementById('aiOut');m.className='';m.textContent='AI po analizon…';out.classList.add('hide');try{const image=await fileData(photo.files[0]);const r=await post({action:'admin.aiDiagnose',token,make:make.value,year:year.value,engine:engine.value,dtc:dtc.value,symptoms:symptoms.value,image});if(!r.ok)throw Error(r.error||'Diagnostika dështoi');out.textContent=r.result||r.text||r.answer||JSON.stringify(r,null,2);out.classList.remove('hide');m.className='ok';m.textContent='Analiza u krye.'}catch(e){m.className='err';m.textContent=e.message}}
if(token)openPanel();
</script></body></html>
